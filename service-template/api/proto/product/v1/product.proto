syntax = "proto3";
package product.v1;
import "buf/validate/validate.proto";
option go_package = "github.com/m8-team/product-service/internal/gen/product/v1;productv1";

service ProductService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
}
message Product {
  string id = 1;
  string name = 2;
}
message GetProductRequest {
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 80}];
}
message GetProductResponse { Product product = 1; }
message CreateProductRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
  string idempotency_key = 2 [(buf.validate.field).string = {min_len: 16, max_len: 128}];
}
message CreateProductResponse { Product product = 1; }
