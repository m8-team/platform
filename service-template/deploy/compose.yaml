services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: product
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product"]
      interval: 2s
      timeout: 2s
      retries: 20
  kafka:
    image: apache/kafka:4.1.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
  topics:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "product.events", "--partitions", "3", "--replication-factor", "1"]
