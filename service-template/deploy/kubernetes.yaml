# Supply image digest, product-config ConfigMap, product-secrets Secret, and
# product-tls Secret through your deployment pipeline. No credentials live here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: product-service}
  template:
    metadata:
      labels: {app: product-service}
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: api
          image: product-service:replace-with-pinned-digest
          ports:
            - {name: https, containerPort: 8080}
            - {name: management, containerPort: 8081}
          envFrom:
            - configMapRef: {name: product-config}
            - secretRef: {name: product-secrets}
          env:
            - {name: TLS_CERT_FILE, value: /tls/tls.crt}
            - {name: TLS_KEY_FILE, value: /tls/tls.key}
            - {name: SHUTDOWN_TIMEOUT, value: 30s}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          startupProbe:
            httpGet: {path: /health/startup, port: management}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tls
          secret: {secretName: product-tls}
---
apiVersion: v1
kind: Service
metadata: {name: product-service}
spec:
  selector: {app: product-service}
  ports:
    - {name: https, port: 443, targetPort: https}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: product-service}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: product-service}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: product-service}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: product-service}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
