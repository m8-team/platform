syntax = "proto3";

package m8.platform.access.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/m8-team/platform/internal/proto/m8/platform/access/v1;access";

// CatalogScope is an authorization limit, NOT a Resource Manager owner placement.
enum CatalogScope {
  CATALOG_SCOPE_UNSPECIFIED = 0;
  CATALOG_SCOPE_INSTANCE = 1;
  CATALOG_SCOPE_COLLECTION = 2;
  CATALOG_SCOPE_ORGANIZATION = 3;
  CATALOG_SCOPE_SUBTREE = 4;
  CATALOG_SCOPE_RESOURCE_KIND = 5;
  CATALOG_SCOPE_TENANT = 6;
}

// CatalogResourceType registers only a protected type, not an actual business object.
message CatalogResourceType {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 3, max_len: 128, pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"}
  ];
  repeated CatalogScope allowed_scopes = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {min_items: 1, max_items: 8, unique: true}
  ];
}

// CatalogPermissionDefinition maps a namespaced action to an owned resource type.
message CatalogPermissionDefinition {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 3, max_len: 128, pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"}
  ];
  string resource_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 3, max_len: 128}
  ];
  // v1 dynamic capability projection supports the fixed graph permission 'use'.
  // A module cannot select privileged built-in graph permission names.
  string graph_permission = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.const = "use"
  ];
}

// CatalogRoleTemplate is immutable at one exact (name,version).
message CatalogRoleTemplate {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 3, max_len: 128}
  ];
  string version = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"}
  ];
  repeated string permissions = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {min_items: 1, max_items: 1024, unique: true}
  ];
  repeated CatalogScope allowed_scopes = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {min_items: 1, max_items: 8, unique: true}
  ];
}

// CatalogModuleManifest is a complete immutable release snapshot.
// The authenticated publisher is determined by the server, never this message.
message CatalogModuleManifest {
  string module_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 64, pattern: "^[a-z][a-z0-9_]*$"}
  ];
  string version = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"}
  ];
  repeated CatalogResourceType resources = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {min_items: 1, max_items: 256}
  ];
  repeated CatalogPermissionDefinition permissions = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {min_items: 1, max_items: 1024}
  ];
  repeated CatalogRoleTemplate roles = 5 [(buf.validate.field).repeated.max_items = 256];
}

// CatalogManifestRecord is a read-side snapshot from authoritative storage.
message CatalogManifestRecord {
  CatalogModuleManifest manifest = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string publisher_subject_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Monotonically increasing per module catalog, distinct from SpiceDB ZedToken.
  int64 revision = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
