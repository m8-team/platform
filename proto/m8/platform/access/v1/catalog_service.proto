syntax = "proto3";

package m8.platform.access.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "m8/platform/access/v1/catalog.proto";

option go_package = "github.com/m8-team/platform/internal/proto/m8/platform/access/v1;access";

// AccessCatalogService publishes module-owned authorization definitions.
// It does NOT create resources, issue grants or change PDP decisions.
service AccessCatalogService {
  // Publishes a complete immutable release with expected revision and retry deduplication.
  rpc PublishModuleManifest(PublishModuleManifestRequest) returns (CatalogManifestRecord) {
    option (google.api.http) = {post: "/access/v1/catalog/manifests:publish", body: "*"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Publish module authorization manifest"
      description: "Requires verified workload identity and authorization for the module namespace."
      operation_id: "PublishModuleManifest"
    };
  }

  // Fetches one exact release, subject to catalog-read permission.
  rpc GetModuleManifest(GetModuleManifestRequest) returns (CatalogManifestRecord) {
    option (google.api.http) = {get: "/access/v1/catalog/modules/{module_id}/manifests/{version}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get module authorization manifest"
      operation_id: "GetModuleManifest"
    };
  }

  // Lists published releases of a module with opaque subject-scoped cursor.
  rpc ListModuleManifests(ListModuleManifestsRequest) returns (ListModuleManifestsResponse) {
    option (google.api.http) = {get: "/access/v1/catalog/modules/{module_id}/manifests"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List published module authorization manifests"
      operation_id: "ListModuleManifests"
    };
  }

  // Reads the resource definitions from a specific published release.
  rpc ListCatalogResourceTypes(GetModuleManifestRequest) returns (ListCatalogResourceTypesResponse) {
    option (google.api.http) = {get: "/access/v1/catalog/modules/{module_id}/manifests/{version}/resource-types"};
  }

  // Reads the permission definitions from a specific published release.
  rpc ListCatalogPermissions(GetModuleManifestRequest) returns (ListCatalogPermissionsResponse) {
    option (google.api.http) = {get: "/access/v1/catalog/modules/{module_id}/manifests/{version}/permissions"};
  }

  // Reads the role templates from a specific published release.
  rpc ListCatalogRoleTemplates(GetModuleManifestRequest) returns (ListCatalogRoleTemplatesResponse) {
    option (google.api.http) = {get: "/access/v1/catalog/modules/{module_id}/manifests/{version}/role-templates"};
  }
}

message PublishModuleManifestRequest {
  CatalogModuleManifest manifest = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  // 0 creates the initial catalog; later publications require a current CAS revision.
  int64 expected_revision = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gte = 0
  ];
  // Repeated identical requests MUST return the original result; different payloads
  // under the same key MUST fail with a conflict.
  string idempotency_key = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 256}
  ];
}

message GetModuleManifestRequest {
  string module_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 64}
  ];
  string version = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 5, max_len: 48}
  ];
}

message ListModuleManifestsRequest {
  string module_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 64}
  ];
  // Default 20; maximum 100. Ordering by published revision, then release version.
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // Subject-scoped opaque cursor generated by the authorized catalog repository.
  string page_token = 3 [(buf.validate.field).string.max_len = 2048];
}

message ListModuleManifestsResponse {
  repeated CatalogManifestRecord manifests = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListCatalogResourceTypesResponse {
  repeated CatalogResourceType resource_types = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListCatalogPermissionsResponse {
  repeated CatalogPermissionDefinition permissions = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListCatalogRoleTemplatesResponse {
  repeated CatalogRoleTemplate roles = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
