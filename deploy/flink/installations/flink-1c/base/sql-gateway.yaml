apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-1c-sql-gateway
  namespace: flink-1c
  labels:
    app.kubernetes.io/name: flink-1c-sql-gateway
    app.kubernetes.io/component: sql-gateway
    app.kubernetes.io/part-of: flink-1c
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flink-1c-sql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flink-1c-sql-gateway
        app.kubernetes.io/component: sql-gateway
        app.kubernetes.io/part-of: flink-1c
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kafka-jaas
          secret:
            secretName: flink-kafka-credentials
            items:
              - key: kafka_client_jaas.conf
                path: kafka_client_jaas.conf
        - name: installation-sql
          configMap:
            name: flink-1c-sql
      containers:
        - name: sql-gateway
          image: flink-runtime:2.2.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /opt/flink/bin/sql-gateway.sh
          args:
            - start-foreground
            - -Dsql-gateway.endpoint.type=rest
            - -Dsql-gateway.endpoint.rest.address=flink-1c-sql-gateway
            - -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
            - -Dsql-gateway.endpoint.rest.port=8083
            - -Dexecution.target=remote
            - -Drest.address=flink-1c-rest
            - -Drest.port=8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djava.security.auth.login.config=/etc/flink/secrets/kafka_client_jaas.conf
          volumeMounts:
            - name: kafka-jaas
              mountPath: /etc/flink/secrets
              readOnly: true
            - name: installation-sql
              mountPath: /opt/flink/installation-sql
              readOnly: true
          ports:
            - name: rest
              containerPort: 8083
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v1/info
              port: rest
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/info
              port: rest
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/info
              port: rest
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flink-1c-sql-gateway
  namespace: flink-1c
  labels:
    app.kubernetes.io/name: flink-1c-sql-gateway
    app.kubernetes.io/component: sql-gateway
    app.kubernetes.io/part-of: flink-1c
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flink-1c-sql-gateway
  ports:
    - name: rest
      port: 8083
      targetPort: rest
      protocol: TCP
