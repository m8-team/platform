# This example is intentionally excluded from kustomization.yaml.
# Copy it to object-storage-secret.yaml or manage the same Secret with SOPS/External Secrets.
# The target filename is ignored by Git; never commit real static access keys.
apiVersion: v1
kind: Secret
metadata:
  name: flink-object-storage-credentials
  namespace: flink-1c
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  access-key-id: "<YANDEX_STATIC_ACCESS_KEY_ID>"
  secret-access-key: "<YANDEX_STATIC_SECRET_ACCESS_KEY>"
