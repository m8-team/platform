# This example is intentionally excluded from kustomization.yaml.
# Copy it to kafka-secret.yaml or manage the same Secret with SOPS/External Secrets.
# The target filename is ignored by Git; never commit the real password.
apiVersion: v1
kind: Secret
metadata:
  name: flink-kafka-credentials
  namespace: flink-1c
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  kafka_client_jaas.conf: |
    KafkaClient {
      org.apache.kafka.common.security.scram.ScramLoginModule required
      username="1c-cr-cdc-consumer"
      password="<KAFKA_PASSWORD>";
    };
