apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-publisher
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: publisher
spec:
  clusterIP: None
  selector:
    app: event-publisher
  ports:
    - port: 8080
      name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: publisher
spec:
  serviceName: publisher
  replicas: 0 # Provision at zero, inject the controller UID, then scale.
  selector:
    matchLabels:
      app: event-publisher
  template:
    metadata:
      labels:
        app: event-publisher
    spec:
      serviceAccountName: event-publisher
      terminationGracePeriodSeconds: 30
      containers:
        - name: publisher
          image: registry.example.com/m8/future-event-publisher:REPLACE
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STATEFULSET_UID
              value: REPLACE_WITH_STATEFULSET_UID
            - name: YDB_DSN
              value: grpcs://ydb.example.com:2135/m8
            - name: YDB_TOKEN_FILE
              value: /run/ydb/token
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: credentials
              mountPath: /run/ydb
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: event-publisher-ydb
