# Supply one m8_ydb_producer_creations_per_second_budget series per job.
# Scope each m8-ydb scrape job to one cluster without duplicate tablet counters.
groups:
  - name: m8-event-ydb
    rules:
      - alert: YDBClusterProducerChurnAboveBudget
        expr: sum by (job) (rate(PQ_SourceIdCreated{job="m8-ydb",counters="tablets",type="PersQueue",category="app"}[15m])) > on (job) m8_ydb_producer_creations_per_second_budget
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: YDB scrape job reports sustained cluster-level producer churn
          description: Compare cluster-level creations with rollout activity and inspect retained counts independently.
      - alert: YDBTransactionLockConflictRate
        expr: sum by (job) (rate(Issues_YQL:KIKIMR_LOCKS_INVALIDATED{job="m8-ydb",counters="kqp"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: YDB is reporting invalidated transaction locks
      - alert: YDBTopicWriteErrors
        expr: sum by (job) (rate(PQ_WriteError{job="m8-ydb",counters="tablets",type="PersQueue",category="app"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: YDB reports sustained topic tablet write errors
