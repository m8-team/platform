    - name: OrgStructureService
    - name: OrgUnitChangeSetService
    - name: OrgUnitExternalReferenceService
    - name: OrgUnitKindService
    - name: OrganizationRelationshipService
    - name: ResourceManagerService
    - name: SharedServicesService
    - name: WorkforceService
      description: Workforce owns engagements; grants are created/removed by M8 Access.
