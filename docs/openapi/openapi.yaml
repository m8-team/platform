                    readOnly: true
                    type: string
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    format: date-time
                deleteTime:
                    readOnly: true
                    type: string
                    format: date-time
        ResourceRecord:
            type: object
            properties:
                tenant:
                    $ref: '#/components/schemas/Tenant'
