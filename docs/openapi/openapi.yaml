components:
    schemas:
        AccessGrant:
            required:
                - subject
                - target
                - permissions
                - reason
                - validFrom
                - expiresAt
            type: object
            properties:
                id:
                    type: string
                subject:
                    $ref: '#/components/schemas/GrantSubject'
                target:
                    $ref: '#/components/schemas/GrantTarget'
                permissions:
                    type: array
                    items:
                        type: string
                reason:
                    enum:
                        - GRANT_REASON_UNSPECIFIED
                        - GRANT_REASON_PROJECT_ASSIGNMENT
                        - GRANT_REASON_SUPPORT_CASE
                        - GRANT_REASON_EXTERNAL_CONTRACT
                        - GRANT_REASON_EMERGENCY
                        - GRANT_REASON_ONE_TIME_TASK
                    type: string
                    format: enum
                reasonReference:
                    type: string
                validFrom:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                constraints:
                    $ref: '#/components/schemas/GrantConstraints'
                state:
                    readOnly: true
                    enum:
                        - GRANT_STATE_UNSPECIFIED
                        - GRANT_STATE_REQUESTED
                        - GRANT_STATE_PENDING_APPROVAL
                        - GRANT_STATE_ACTIVE
                        - GRANT_STATE_REJECTED
                        - GRANT_STATE_REVOKED
                        - GRANT_STATE_EXPIRED
                    type: string
                    format: enum
                requestedByPrincipalId:
                    readOnly: true
                    type: string
                approvedByPrincipalId:
                    readOnly: true
                    type: string
                revokedByPrincipalId:
                    readOnly: true
                    type: string
                revokedAt:
                    readOnly: true
                    type: string
                    format: date-time
                revision:
                    readOnly: true
                    type: string
        Action:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: Required. Action name, for example "can_read", "read", or "project.delete".
                properties:
                    type: object
                    description: Optional. Additional AuthZEN-compatible action attributes.
            description: Action identifies the operation being authorized.
        AdditionalPropertiesItem:
            type: object
            properties:
                schemaOrReference:
                    $ref: '#/components/schemas/SchemaOrReference'
                boolean:
                    type: boolean
        Any:
            type: object
            properties:
                value:
                    $ref: '#/components/schemas/GoogleProtobufAny'
                yaml:
                    type: string
        AnyOrExpression:
            type: object
            properties:
                any:
                    $ref: '#/components/schemas/Any'
                expression:
                    $ref: '#/components/schemas/Expression'
        ApplyOrgUnitChangeSetRequest:
            required:
                - changeSet
                - idempotencyKey
            type: object
            properties:
                changeSet:
                    $ref: '#/components/schemas/OrgUnitChangeSet'
                idempotencyKey:
                    type: string
        ApplyOrgUnitChangeSetResponse:
            type: object
            properties:
                structureRevision:
                    type: string
                replayed:
                    type: boolean
        ApprovalChallengeResponse:
            required:
                - approved
            type: object
            properties:
                approved:
                    type: boolean
                approvalToken:
                    type: string
                proof:
                    type: string
                denialReason:
                    type: string
        ApproveGrantRequest:
            required:
                - id
                - expectedRevision
                - idempotencyKey
            type: object
            properties:
                id:
                    type: string
                expectedRevision:
                    type: string
                idempotencyKey:
                    type: string
        AssignCaseRequest:
            required:
                - id
                - assigneePrincipalId
                - expectedRevision
                - idempotencyKey
            type: object
            properties:
                id:
                    type: string
                assigneePrincipalId:
                    type: string
                expectedRevision:
                    type: string
                idempotencyKey:
                    type: string
        AuthenticationChallengeResponse:
            type: object
            properties:
                otp:
                    $ref: '#/components/schemas/OtpChallengeResponse'
                password:
                    $ref: '#/components/schemas/PasswordChallengeResponse'
                webauthn:
                    $ref: '#/components/schemas/WebAuthnAssertionResponse'
                approval:
                    $ref: '#/components/schemas/ApprovalChallengeResponse'
        AuthenticationContext:
            type: object
            properties:
                request:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/RequestContext'
                session:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/SessionContext'
                resource:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/ResourceContext'
                interaction:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/InteractionContext'
                device:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/DeviceContext'
                network:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/NetworkContext'
                oidc:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/OidcContext'
                ciba:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/CibaContext'
                transaction:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/TransactionContext'
        AuthenticationOptions:
            type: object
            properties:
                methodId:
                    type: string
                providerId:
                    type: string
        AuthenticationSubject:
            type: object
            properties:
                userId:
                    type: string
                    description: Stable user identifier.
                email:
                    type: string
                    description: Email address entered by the user.
                phone:
                    allOf:
                        - $ref: '#/components/schemas/PhoneNumber'
                    description: Phone number normalized as an international E.164 number.
                username:
                    type: string
                    description: Tenant-local username or login name.
            description: |-
                AuthenticationSubject identifies the claimant at the start of authentication.

                 The caller must provide exactly one identifier. These values are request-only
                 inputs and must not be returned raw in public Authentication snapshots.
        Callback:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/NamedPathItem'
                specificationExtension:
                    type: array
                    items:
                        $ref: '#/components/schemas/NamedAny'
            description: A map of possible out-of band callbacks related to the parent operation. Each value in the map is a Path Item Object that describes a set of requests that may be initiated by the API provider and the expected responses. The key value used to identify the callback object is an expression, evaluated at runtime, that identifies a URL to use for the callback operation.
        CallbackOrReference:
            type: object
            properties:
                callback:
                    $ref: '#/components/schemas/Callback'
                reference:
                    $ref: '#/components/schemas/Reference'
        CallbacksOrReferences:
            type: object
            properties:
                additionalProperties:
                    type: array
                    items:
                        $ref: '#/components/schemas/NamedCallbackOrReference'
        CancelRequest:
