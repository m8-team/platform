                    $ref: '#/components/schemas/OrganizationGroup'
                organization:
                    $ref: '#/components/schemas/Organization'
                workspace:
                    $ref: '#/components/schemas/Workspace'
                environment:
                    $ref: '#/components/schemas/Environment'
                workloadService:
                    $ref: '#/components/schemas/WorkloadService'
                descriptor:
                    $ref: '#/components/schemas/ResourceDescriptor'
        ResourceRef:
            required:
                - type
                - id
            type: object
            properties:
                type:
                    type: string
                    description: |-
                        Required. Resource type.

                         Recommended format:
                           {service}.{resource}

                         Examples:
                           resourcemanager.organization
                           resourcemanager.workspace
                           resourcemanager.service
                           provisioning.kafka_topic
                           provisioning.database
                           identity.user
                           access.permission_schema
                id:
                    type: string
                    description: |-
                        Required. Stable resource identifier.

                         For Resource Manager resources this is usually UUID.
                         For external/provider resources this may be provider-specific.
                name:
                    type: string
                    description: |-
                        Optional. Full resource name.

                         Examples:
                           organizations/{organization_id}
            description: ResourceRef is a generic reference to any M8 Platform resource.
        ResourceSelector:
            required:
                - type
            type: object
            properties:
                type:
                    type: string
                    description: Required. Resource type to search for, for example "account".
                id:
                    type: string
                    description: Optional. Resource Search callers SHOULD omit id; if present, the PDP ignores it.
                properties:
                    type: object
                    description: Optional. Additional selector attributes understood by the PDP.
            description: ResourceSelector selects resources by type for the Resource Search API.
        Response:
            type: object
            properties:
                description:
                    type: string
                headers:
