            type: object
            properties:
                id:
                    type: string
                reason:
                    type: string
                idempotencyKey:
                    type: string
        Schema:
            type: object
            properties:
                nullable:
                    type: boolean
                discriminator:
                    $ref: '#/components/schemas/Discriminator'
                readOnly:
                    type: boolean
                writeOnly:
                    type: boolean
                xml:
                    $ref: '#/components/schemas/Xml'
                externalDocs:
                    $ref: '#/components/schemas/ExternalDocs'
                example:
                    $ref: '#/components/schemas/Any'
                deprecated:
                    type: boolean
                title:
                    type: string
                multipleOf:
                    type: number
                    format: double
                maximum:
                    type: number
                    format: double
                exclusiveMaximum:
                    type: boolean
                minimum:
                    type: number
                    format: double
                exclusiveMinimum:
                    type: boolean
                maxLength:
                    type: string
                minLength:
                    type: string
                pattern:
                    type: string
                maxItems:
                    type: string
                minItems:
                    type: string
                uniqueItems:
                    type: boolean
                maxProperties:
                    type: string
                minProperties:
                    type: string
                required:
                    type: array
                    items:
                        type: string
                enum:
                    type: array
                    items:
                        $ref: '#/components/schemas/Any'
                type:
                    type: string
                allOf:
                    type: array
                    items:
                        $ref: '#/components/schemas/SchemaOrReference'
                oneOf:
                    type: array
                    items:
                        $ref: '#/components/schemas/SchemaOrReference'
                anyOf:
                    type: array
                    items:
                        $ref: '#/components/schemas/SchemaOrReference'
                not:
                    $ref: '#/components/schemas/Schema'
                items:
                    $ref: '#/components/schemas/ItemsItem'
                properties:
                    $ref: '#/components/schemas/Properties'
                additionalProperties:
                    $ref: '#/components/schemas/AdditionalPropertiesItem'
                default:
                    $ref: '#/components/schemas/DefaultType'
                description:
                    type: string
                format:
                    type: string
                specificationExtension:
                    type: array
                    items:
                        $ref: '#/components/schemas/NamedAny'
            description: The Schema Object allows the definition of input and output data types. These types can be objects, but also primitives and arrays. This object is an extended subset of the JSON Schema Specification Wright Draft 00.  For more information about the properties, see JSON Schema Core and JSON Schema Validation. Unless stated otherwise, the property definitions follow the JSON Schema.
        SchemaOrReference:
            type: object
            properties:
                schema:
                    $ref: '#/components/schemas/Schema'
                reference:
                    $ref: '#/components/schemas/Reference'
        SearchActionsRequest:
            required:
                - subject
                - resource
            type: object
            properties:
                subject:
                    allOf:
                        - $ref: '#/components/schemas/Subject'
                    description: Required. Subject for which permitted actions are searched.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    description: Required. Resource on which actions are searched.
                context:
                    type: object
                    description: Optional. Contextual data for the search request.
                page:
                    allOf:
                        - $ref: '#/components/schemas/PageRequest'
                    description: Optional. Pagination request.
            description: SearchActionsRequest asks which actions the subject may perform on the resource.
        SearchActionsResponse:
            required:
                - results
            type: object
            properties:
                results:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/Action'
                    description: Required. Matching actions. The array may be empty.
                page:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/PageResponse'
                    description: Output only. Pagination response. Present when pagination metadata is returned.
                context:
                    readOnly: true
                    type: object
                    description: Output only. Additional response context, such as query diagnostics.
            description: SearchActionsResponse returns actions the subject may perform.
        SearchResourcesRequest:
            required:
                - subject
                - action
                - resource
            type: object
            properties:
                subject:
                    allOf:
                        - $ref: '#/components/schemas/Subject'
                    description: Required. Subject for which permitted resources are searched.
                action:
                    allOf:
                        - $ref: '#/components/schemas/Action'
                    description: Required. Action the subject must be allowed to perform.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceSelector'
                    description: Required. Resource selector. The type is required; id should be omitted and is ignored if present.
                context:
                    type: object
                    description: Optional. Contextual data for the search request.
                page:
                    allOf:
                        - $ref: '#/components/schemas/PageRequest'
                    description: Optional. Pagination request.
            description: SearchResourcesRequest asks which resources of a type are accessible.
        SearchResourcesResponse:
            required:
                - results
            type: object
            properties:
                results:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/Resource'
                    description: Required. Matching resources. The array may be empty.
                page:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/PageResponse'
                    description: Output only. Pagination response. Present when pagination metadata is returned.
                context:
                    readOnly: true
                    type: object
                    description: Output only. Additional response context, such as query diagnostics.
            description: SearchResourcesResponse returns resources accessible to the subject.
        SearchSubjectsRequest:
            required:
                - subject
                - action
                - resource
            type: object
            properties:
