openapi: 3.0.3
info:
  title: Authentication API
  description: Caller authentication is required for all RPCs, including Create and operation polling. Every call must authorize the caller for the owning client/resource. Non-Create RPCs additionally require the interaction token described by AuthenticationInteraction. IDs alone never authorize access. Mutation operations finish when the command is applied, not when the entire authentication finishes. Poll Get for subsequent provider-driven changes. Mutation request_id deduplication is scoped to caller, client, RPC and target. Retain keys at least 24 hours and through authentication expiry; identical retries return the original operation without repeating side effects, while reuse with a different payload returns ALREADY_EXISTS. Authorize before replay.
  version: v1
paths:
  /iam/v1/authentications/{authenticationId}:
    get:
      description: Returns the latest public snapshot, including asynchronous state changes.
      operationId: AuthenticationService_Get
      parameters:
        - name: authenticationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authentication'
  /iam/v1/authentications/{authenticationId}/challenges/{challengeId}:resend:
    post:
      operationId: AuthenticationService_ResendChallenge
      parameters:
        - name: authenticationId
          in: path
          required: true
          schema:
            type: string
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendChallengeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /iam/v1/authentications/{authenticationId}/challenges/{challengeId}:select:
    post:
      operationId: AuthenticationService_SelectChallenge
      parameters:
        - name: authenticationId
          in: path
          required: true
          schema:
            type: string
        - name: challengeId
          in: path
          description: |-
            One of the available_challenges[].challenge_id values in the latest snapshot.
             Reject unavailable or stale candidates without changing the active challenge.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectChallengeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /iam/v1/authentications/{authenticationId}/challenges/{challengeId}:verify:
    post:
      operationId: AuthenticationService_VerifyChallenge
      parameters:
        - name: authenticationId
          in: path
          required: true
          schema:
            type: string
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyChallengeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /iam/v1/authentications/{authenticationId}:cancel:
    post:
      operationId: AuthenticationService_Cancel
      parameters:
        - name: authenticationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /iam/v1/authentications:create:
    post:
      operationId: AuthenticationService_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
components:
  schemas:
    ApprovalChallenge:
      type: object
      properties:
        bindingMessage:
          readOnly: true
          type: string
        approvalChannel:
          readOnly: true
          enum:
            - APPROVAL_CHANNEL_UNSPECIFIED
            - APPROVAL_CHANNEL_PUSH
            - APPROVAL_CHANNEL_SIM_PUSH
            - APPROVAL_CHANNEL_MOBILE_ID
            - APPROVAL_CHANNEL_BANK_ID
          type: string
          format: enum
        approvalDeviceHint:
          readOnly: true
          type: string
        expiresInSeconds:
          readOnly: true
          type: integer
          format: int32
    ApprovalChallengeResponse:
      required:
        - approved
      type: object
      properties:
        approved:
          type: boolean
        approvalToken:
          type: string
        proof:
          type: string
        denialReason:
          type: string
    Authentication:
      type: object
      properties:
        id:
          readOnly: true
          type: string
        clientId:
          readOnly: true
          type: string
        subject:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuthenticationSubject'
          description: |-
            Deprecated. Servers must omit this request-only identifier from all snapshots.
             Use public_subject for a masked presentation of the claimant.
        purpose:
          readOnly: true
          enum:
            - AUTHENTICATION_PURPOSE_UNSPECIFIED
            - AUTHENTICATION_PURPOSE_PRIMARY_LOGIN
            - AUTHENTICATION_PURPOSE_REAUTHENTICATION
            - AUTHENTICATION_PURPOSE_STEP_UP
            - AUTHENTICATION_PURPOSE_ACCOUNT_RECOVERY
            - AUTHENTICATION_PURPOSE_IDENTITY_LINKING
            - AUTHENTICATION_PURPOSE_TRANSACTION_CONFIRMATION
          type: string
          format: enum
        state:
          readOnly: true
          enum:
            - AUTHENTICATION_STATE_UNSPECIFIED
            - AUTHENTICATION_STATE_STARTING
            - AUTHENTICATION_STATE_CHALLENGE_REQUIRED
            - AUTHENTICATION_STATE_CHALLENGE_SENT
            - AUTHENTICATION_STATE_VERIFYING
            - AUTHENTICATION_STATE_AUTHENTICATED
            - AUTHENTICATION_STATE_FAILED
            - AUTHENTICATION_STATE_CANCELLED
            - AUTHENTICATION_STATE_EXPIRED
          type: string
          format: enum
        stateReason:
          readOnly: true
          enum:
            - AUTHENTICATION_STATE_REASON_UNSPECIFIED
            - AUTHENTICATION_STATE_REASON_START_ACCEPTED
            - AUTHENTICATION_STATE_REASON_SUBJECT_RESOLVED
            - AUTHENTICATION_STATE_REASON_SUBJECT_NOT_FOUND
            - AUTHENTICATION_STATE_REASON_RISK_ALLOWED
            - AUTHENTICATION_STATE_REASON_RISK_CHALLENGE_REQUIRED
            - AUTHENTICATION_STATE_REASON_RISK_BLOCKED
            - AUTHENTICATION_STATE_REASON_CHALLENGE_SELECTED
            - AUTHENTICATION_STATE_REASON_CHALLENGE_SENT
            - AUTHENTICATION_STATE_REASON_CHALLENGE_RESENT
            - AUTHENTICATION_STATE_REASON_CHALLENGE_RESPONSE_INVALID
            - AUTHENTICATION_STATE_REASON_ATTEMPTS_EXCEEDED
            - AUTHENTICATION_STATE_REASON_USER_APPROVED
            - AUTHENTICATION_STATE_REASON_USER_DENIED
            - AUTHENTICATION_STATE_REASON_PROVIDER_REDIRECT_REQUIRED
            - AUTHENTICATION_STATE_REASON_PROVIDER_CALLBACK_RECEIVED
            - AUTHENTICATION_STATE_REASON_PROVIDER_CALLBACK_INVALID
            - AUTHENTICATION_STATE_REASON_PROVIDER_TIMEOUT
            - AUTHENTICATION_STATE_REASON_WEBAUTHN_ASSERTION_INVALID
            - AUTHENTICATION_STATE_REASON_AUTHENTICATED
            - AUTHENTICATION_STATE_REASON_EXPIRED
            - AUTHENTICATION_STATE_REASON_CANCELLED
            - AUTHENTICATION_STATE_REASON_FAILED
            - AUTHENTICATION_STATE_REASON_CHALLENGE_RESELECTED
            - AUTHENTICATION_STATE_REASON_RESEND_NOT_AVAILABLE
            - AUTHENTICATION_STATE_REASON_METHOD_NOT_ALLOWED
            - AUTHENTICATION_STATE_REASON_PROVIDER_NOT_ALLOWED
          type: string
          format: enum
        currentChallenge:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuthenticationChallengeInfo'
        availableChallenges:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationChallengeOption'
        error:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuthenticationError'
        result:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuthenticationResult'
        context:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuthenticationContext'
        createTime:
          readOnly: true
          type: string
          format: date-time
        updateTime:
          readOnly: true
          type: string
          format: date-time
        expireTime:
          readOnly: true
          type: string
          format: date-time
        requestedAssuranceLevel:
          readOnly: true
          enum:
            - AUTHENTICATION_ASSURANCE_LEVEL_UNSPECIFIED
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL0
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL1
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL2
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL3
          type: string
          format: enum
        version:
          readOnly: true
          type: string
        publicSubject:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuthenticationPublicSubject'
    AuthenticationChallengeInfo:
      type: object
      properties:
        id:
          readOnly: true
          type: string
        kind:
          readOnly: true
          enum:
            - AUTHENTICATION_CHALLENGE_KIND_UNSPECIFIED
            - AUTHENTICATION_CHALLENGE_KIND_PASSWORD_INPUT
            - AUTHENTICATION_CHALLENGE_KIND_OTP_INPUT
            - AUTHENTICATION_CHALLENGE_KIND_APPROVAL
            - AUTHENTICATION_CHALLENGE_KIND_REDIRECT
            - AUTHENTICATION_CHALLENGE_KIND_WEBAUTHN_ASSERTION
            - AUTHENTICATION_CHALLENGE_KIND_PROVIDER_CALLBACK
          type: string
          format: enum
        method:
          readOnly: true
          enum:
            - AUTHENTICATION_METHOD_UNSPECIFIED
            - AUTHENTICATION_METHOD_PASSWORD
            - AUTHENTICATION_METHOD_SMS_OTP
            - AUTHENTICATION_METHOD_EMAIL_OTP
            - AUTHENTICATION_METHOD_TOTP
            - AUTHENTICATION_METHOD_PUSH_APPROVAL
            - AUTHENTICATION_METHOD_PUSH_OTP
            - AUTHENTICATION_METHOD_SIM_PUSH
            - AUTHENTICATION_METHOD_MOBILE_ID
            - AUTHENTICATION_METHOD_WEBAUTHN_PASSKEY
            - AUTHENTICATION_METHOD_OIDC
            - AUTHENTICATION_METHOD_SAML
          type: string
          format: enum
        methodId:
          readOnly: true
          type: string
        providerId:
          readOnly: true
          type: string
        deliveryChannel:
          readOnly: true
          enum:
            - AUTHENTICATION_DELIVERY_CHANNEL_UNSPECIFIED
            - AUTHENTICATION_DELIVERY_CHANNEL_CLIENT
            - AUTHENTICATION_DELIVERY_CHANNEL_SMS
            - AUTHENTICATION_DELIVERY_CHANNEL_EMAIL
            - AUTHENTICATION_DELIVERY_CHANNEL_AUTHENTICATOR_APP
            - AUTHENTICATION_DELIVERY_CHANNEL_PUSH
            - AUTHENTICATION_DELIVERY_CHANNEL_SIM_PUSH
            - AUTHENTICATION_DELIVERY_CHANNEL_MOBILE_ID
            - AUTHENTICATION_DELIVERY_CHANNEL_WEBAUTHN
            - AUTHENTICATION_DELIVERY_CHANNEL_OIDC
            - AUTHENTICATION_DELIVERY_CHANNEL_SAML
          type: string
          format: enum
        maskedDestination:
          readOnly: true
          type: string
        expireTime:
          readOnly: true
          type: string
          format: date-time
        resendAvailableTime:
          readOnly: true
          type: string
          format: date-time
        attemptCount:
          readOnly: true
          type: integer
          format: int32
        remainingAttempts:
          readOnly: true
          type: integer
          format: int32
        actions:
          readOnly: true
          type: array
          items:
            enum:
              - AUTHENTICATION_CHALLENGE_ACTION_UNSPECIFIED
              - AUTHENTICATION_CHALLENGE_ACTION_SUBMIT
              - AUTHENTICATION_CHALLENGE_ACTION_RESEND
              - AUTHENTICATION_CHALLENGE_ACTION_CANCEL
              - AUTHENTICATION_CHALLENGE_ACTION_SELECT_ANOTHER_METHOD
            type: string
            format: enum
        capabilities:
          readOnly: true
          type: array
          items:
            enum:
              - AUTHENTICATION_CHALLENGE_CAPABILITY_UNSPECIFIED
              - AUTHENTICATION_CHALLENGE_CAPABILITY_SUBMIT
              - AUTHENTICATION_CHALLENGE_CAPABILITY_RESEND
              - AUTHENTICATION_CHALLENGE_CAPABILITY_AUTOFILL
              - AUTHENTICATION_CHALLENGE_CAPABILITY_PASSKEY_CONDITIONAL_UI
              - AUTHENTICATION_CHALLENGE_CAPABILITY_SELECT_ANOTHER_METHOD
            type: string
            format: enum
        customCapabilities:
          readOnly: true
          type: array
          items:
            type: string
        password:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/PasswordChallenge'
        otp:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/OtpChallenge'
        webauthn:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/WebAuthnChallenge'
        redirect:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/RedirectChallenge'
        approval:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ApprovalChallenge'
        mobileId:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/MobileIdChallenge'
        providerCallback:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ProviderCallbackChallenge'
    AuthenticationChallengeOption:
      type: object
      properties:
        method:
          readOnly: true
          enum:
            - AUTHENTICATION_METHOD_UNSPECIFIED
            - AUTHENTICATION_METHOD_PASSWORD
            - AUTHENTICATION_METHOD_SMS_OTP
            - AUTHENTICATION_METHOD_EMAIL_OTP
            - AUTHENTICATION_METHOD_TOTP
            - AUTHENTICATION_METHOD_PUSH_APPROVAL
            - AUTHENTICATION_METHOD_PUSH_OTP
            - AUTHENTICATION_METHOD_SIM_PUSH
            - AUTHENTICATION_METHOD_MOBILE_ID
            - AUTHENTICATION_METHOD_WEBAUTHN_PASSKEY
            - AUTHENTICATION_METHOD_OIDC
            - AUTHENTICATION_METHOD_SAML
          type: string
          format: enum
        methodId:
          readOnly: true
          type: string
        providerId:
          readOnly: true
          type: string
        kind:
          readOnly: true
          enum:
            - AUTHENTICATION_CHALLENGE_KIND_UNSPECIFIED
            - AUTHENTICATION_CHALLENGE_KIND_PASSWORD_INPUT
            - AUTHENTICATION_CHALLENGE_KIND_OTP_INPUT
            - AUTHENTICATION_CHALLENGE_KIND_APPROVAL
            - AUTHENTICATION_CHALLENGE_KIND_REDIRECT
            - AUTHENTICATION_CHALLENGE_KIND_WEBAUTHN_ASSERTION
            - AUTHENTICATION_CHALLENGE_KIND_PROVIDER_CALLBACK
          type: string
          format: enum
        displayName:
          readOnly: true
          type: string
        priority:
          readOnly: true
          type: integer
          format: int32
        available:
          readOnly: true
          type: boolean
        unavailableReason:
          readOnly: true
          type: string
        maskedDestination:
          readOnly: true
          type: string
        deliveryChannel:
          readOnly: true
          enum:
            - AUTHENTICATION_DELIVERY_CHANNEL_UNSPECIFIED
            - AUTHENTICATION_DELIVERY_CHANNEL_CLIENT
            - AUTHENTICATION_DELIVERY_CHANNEL_SMS
            - AUTHENTICATION_DELIVERY_CHANNEL_EMAIL
            - AUTHENTICATION_DELIVERY_CHANNEL_AUTHENTICATOR_APP
            - AUTHENTICATION_DELIVERY_CHANNEL_PUSH
            - AUTHENTICATION_DELIVERY_CHANNEL_SIM_PUSH
            - AUTHENTICATION_DELIVERY_CHANNEL_MOBILE_ID
            - AUTHENTICATION_DELIVERY_CHANNEL_WEBAUTHN
            - AUTHENTICATION_DELIVERY_CHANNEL_OIDC
            - AUTHENTICATION_DELIVERY_CHANNEL_SAML
          type: string
          format: enum
        capabilities:
          readOnly: true
          type: array
          items:
            enum:
              - AUTHENTICATION_CHALLENGE_CAPABILITY_UNSPECIFIED
              - AUTHENTICATION_CHALLENGE_CAPABILITY_SUBMIT
              - AUTHENTICATION_CHALLENGE_CAPABILITY_RESEND
              - AUTHENTICATION_CHALLENGE_CAPABILITY_AUTOFILL
              - AUTHENTICATION_CHALLENGE_CAPABILITY_PASSKEY_CONDITIONAL_UI
              - AUTHENTICATION_CHALLENGE_CAPABILITY_SELECT_ANOTHER_METHOD
            type: string
            format: enum
        customCapabilities:
          readOnly: true
          type: array
          items:
            type: string
        hints:
          readOnly: true
          type: object
          additionalProperties:
            type: string
        recommended:
          readOnly: true
          type: boolean
        challengeId:
          readOnly: true
          type: string
          description: |-
            Authentication-scoped candidate ID accepted by SelectChallenge.challenge_id.
             Selection activates this candidate; current_challenge.id has the same ID.
    AuthenticationChallengeResponse:
      type: object
      properties:
        otp:
          $ref: '#/components/schemas/OtpChallengeResponse'
        password:
          $ref: '#/components/schemas/PasswordChallengeResponse'
        webauthn:
          $ref: '#/components/schemas/WebAuthnAssertionResponse'
        approval:
          $ref: '#/components/schemas/ApprovalChallengeResponse'
    AuthenticationContext:
      type: object
      properties:
        request:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/RequestContext'
        session:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/SessionContext'
        resource:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceContext'
        interaction:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/InteractionContext'
        device:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/DeviceContext'
        network:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/NetworkContext'
        oidc:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/OidcContext'
        ciba:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/CibaContext'
        transaction:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/TransactionContext'
    AuthenticationError:
      type: object
      properties:
        code:
          readOnly: true
          enum:
            - AUTHENTICATION_ERROR_CODE_UNSPECIFIED
            - AUTHENTICATION_ERROR_CODE_AUTHENTICATION_FAILED
            - AUTHENTICATION_ERROR_CODE_INVALID_CREDENTIALS
            - AUTHENTICATION_ERROR_CODE_METHOD_NOT_ALLOWED
            - AUTHENTICATION_ERROR_CODE_PROVIDER_NOT_ALLOWED
            - AUTHENTICATION_ERROR_CODE_PROVIDER_CALLBACK_INVALID
            - AUTHENTICATION_ERROR_CODE_ATTEMPTS_EXCEEDED
            - AUTHENTICATION_ERROR_CODE_EXPIRED
            - AUTHENTICATION_ERROR_CODE_BLOCKED
            - AUTHENTICATION_ERROR_CODE_DENIED
            - AUTHENTICATION_ERROR_CODE_INTERNAL
            - AUTHENTICATION_ERROR_CODE_SUBJECT_NOT_FOUND
            - AUTHENTICATION_ERROR_CODE_USER_NOT_FOUND
            - AUTHENTICATION_ERROR_CODE_PHONE_NOT_FOUND
            - AUTHENTICATION_ERROR_CODE_EMAIL_NOT_FOUND
            - AUTHENTICATION_ERROR_CODE_PROVIDER_ACCOUNT_NOT_FOUND
            - AUTHENTICATION_ERROR_CODE_INVALID_CHALLENGE_RESPONSE
          type: string
          format: enum
        message:
          readOnly: true
          type: string
        retryable:
          readOnly: true
          type: boolean
        visibility:
          readOnly: true
          enum:
            - AUTHENTICATION_ERROR_VISIBILITY_UNSPECIFIED
            - AUTHENTICATION_ERROR_VISIBILITY_PUBLIC
            - AUTHENTICATION_ERROR_VISIBILITY_ADMIN
            - AUTHENTICATION_ERROR_VISIBILITY_INTERNAL
          type: string
          format: enum
        providerId:
          readOnly: true
          type: string
        providerErrorCode:
          readOnly: true
          type: string
        details:
          readOnly: true
          type: object
          additionalProperties:
            type: string
    AuthenticationHandoff:
      type: object
      properties:
        type:
          readOnly: true
          enum:
            - TYPE_UNSPECIFIED
            - AUTHORIZATION_CODE
            - CIBA_AUTH_REQ_ID
            - SESSION_HANDOFF
            - JWT_BEARER_ASSERTION
            - KEYCLOAK_LOGIN_ACTION
          type: string
          format: enum
        handoffId:
          readOnly: true
          type: string
        expireTime:
          readOnly: true
          type: string
          format: date-time
    AuthenticationOptions:
      type: object
      properties:
        methodId:
          type: string
        providerId:
          type: string
    AuthenticationPublicSubject:
      type: object
      properties:
        maskedIdentifier:
          readOnly: true
          type: string
      description: |-
        Safe presentation of the caller-supplied identifier. Must not reveal whether
         an account exists. Never contains a raw email, phone, username or user ID.
    AuthenticationResult:
      type: object
      properties:
        authTime:
          readOnly: true
          type: string
          format: date-time
        achievedAssuranceLevel:
          readOnly: true
          enum:
            - AUTHENTICATION_ASSURANCE_LEVEL_UNSPECIFIED
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL0
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL1
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL2
            - AUTHENTICATION_ASSURANCE_LEVEL_AAL3
          type: string
          format: enum
        authenticationMethods:
          readOnly: true
          type: array
          items:
            enum:
              - AUTHENTICATION_METHOD_UNSPECIFIED
              - AUTHENTICATION_METHOD_PASSWORD
              - AUTHENTICATION_METHOD_SMS_OTP
              - AUTHENTICATION_METHOD_EMAIL_OTP
              - AUTHENTICATION_METHOD_TOTP
              - AUTHENTICATION_METHOD_PUSH_APPROVAL
              - AUTHENTICATION_METHOD_PUSH_OTP
              - AUTHENTICATION_METHOD_SIM_PUSH
              - AUTHENTICATION_METHOD_MOBILE_ID
              - AUTHENTICATION_METHOD_WEBAUTHN_PASSKEY
              - AUTHENTICATION_METHOD_OIDC
              - AUTHENTICATION_METHOD_SAML
            type: string
            format: enum
        methodIds:
          readOnly: true
          type: array
          items:
            type: string
        amr:
          readOnly: true
          type: array
          items:
            type: string
        acr:
          readOnly: true
          type: string
        handoff:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuthenticationHandoff'
    AuthenticationStartContext:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/RequestHint'
        session:
          $ref: '#/components/schemas/SessionHint'
        resource:
          $ref: '#/components/schemas/ResourceHint'
        interaction:
          $ref: '#/components/schemas/InteractionHint'
        device:
          $ref: '#/components/schemas/DeviceHint'
        network:
          $ref: '#/components/schemas/NetworkHint'
        oidc:
          $ref: '#/components/schemas/OidcRequestHint'
        ciba:
          $ref: '#/components/schemas/CibaRequestHint'
        transaction:
          $ref: '#/components/schemas/TransactionHint'
    AuthenticationSubject:
      type: object
      properties:
        userId:
          type: string
          description: Stable user identifier.
        email:
          type: string
          description: Email address entered by the user.
        phone:
          allOf:
            - $ref: '#/components/schemas/PhoneNumber'
          description: Phone number normalized as an international E.164 number.
        username:
          type: string
          description: Tenant-local username or login name.
      description: |-
        AuthenticationSubject identifies the claimant at the start of authentication.

         The caller must provide exactly one identifier. These values are request-only
         inputs and must not be returned raw in public Authentication snapshots.
    CancelRequest:
      required:
        - authenticationId
      type: object
      properties:
        authenticationId:
          type: string
        reason:
          type: string
        requestId:
          type: string
          description: Idempotency key; see AuthenticationService and CreateRequest.request_id.
    CibaContext:
      type: object
      properties:
        bindingMessage:
          readOnly: true
          type: string
        expireTime:
          readOnly: true
          type: string
          format: date-time
        interval:
          readOnly: true
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        clientNotificationTokenId:
          readOnly: true
          type: string
    CibaRequestHint:
      type: object
      properties:
        loginHintToken:
          type: string
        idTokenHint:
          type: string
        bindingMessage:
          type: string
        requestedExpiry:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
    CreateRequest:
      required:
        - clientId
      type: object
      properties:
        clientId:
          type: string
        subject:
          $ref: '#/components/schemas/AuthenticationSubject'
        context:
          allOf:
            - $ref: '#/components/schemas/AuthenticationContext'
          description: |-
            Deprecated output context. Servers reject a supplied value with
             INVALID_ARGUMENT; never trust caller-supplied resolved context.
        options:
          $ref: '#/components/schemas/AuthenticationOptions'
        startContext:
          allOf:
            - $ref: '#/components/schemas/AuthenticationStartContext'
          description: Untrusted input hints; the server resolves and verifies authoritative state.
        requestId:
          type: string
          description: |-
            Optional for legacy clients. Supply a fresh UUID for each logical command
