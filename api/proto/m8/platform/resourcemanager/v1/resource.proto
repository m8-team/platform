syntax = "proto3";
package m8.platform.resourcemanager.v1;
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/m8-team/go-genproto/m8/platform/resourcemanager/v1;resourcemanager";

// Resource identity is global within a tenant; the kind is a stable namespaced string.
message ResourceRef {
  string kind = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.min_len = 1];
  string id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.uuid = true];
}

// Exactly one immediate owner. The owning Organization is derived on the server.
message OwnerScope {
  oneof owner {
    string organization_id = 1 [(buf.validate.field).string.uuid = true];
    string workspace_id = 2 [(buf.validate.field).string.uuid = true];
    string project_id = 3 [(buf.validate.field).string.uuid = true];
  }
}

// A business Group is NOT a parent scope; group affiliation grants no access.
enum ResourceState {
  RESOURCE_STATE_UNSPECIFIED = 0;
  RESOURCE_STATE_ACTIVE = 1;
  RESOURCE_STATE_SUSPENDED = 2;
  RESOURCE_STATE_ARCHIVED = 3;
  RESOURCE_STATE_DELETED = 4;
}
message ResourceMetadata {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER, (buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.max_len = 256];
  string description = 3 [(buf.validate.field).string.max_len = 1024];
  map<string,string> labels = 4;
  ResourceState state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 revision = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Module-owned resources remain canonically stored in their module.
// Resource Manager stores only searchable ownership metadata.
message ResourceDescriptor {
  ResourceRef resource = 1 [(google.api.field_behavior) = REQUIRED];
  OwnerScope owner = 2 [(google.api.field_behavior) = REQUIRED];
  string owning_organization_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  ResourceMetadata metadata = 4 [(google.api.field_behavior) = REQUIRED];
  string module = 5 [(google.api.field_behavior) = REQUIRED];
}

// A resource kind registry prevents arbitrary use of containment.
message ResourceKindPolicy {
  string kind = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string allowed_owner_kinds = 2;
  string responsible_module = 3 [(google.api.field_behavior) = REQUIRED];
  bool environment_binding_allowed = 4;
}
