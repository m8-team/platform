syntax = "proto3";

package m8.platform.resourcemanager.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "m8/platform/resourcemanager/v1/resource.proto";

option go_package = "github.com/m8-team/go-genproto/m8/platform/resourcemanager/v1;resourcemanager";

enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_PRODUCTION = 1;
  ENVIRONMENT_KIND_STAGING = 2;
  ENVIRONMENT_KIND_DEVELOPMENT = 3;
  ENVIRONMENT_KIND_TESTING = 4;
  ENVIRONMENT_KIND_PREVIEW = 5;
  ENVIRONMENT_KIND_CUSTOM = 6;
}

enum IsolationProfile {
  ISOLATION_PROFILE_UNSPECIFIED = 0;

  ISOLATION_PROFILE_LOGICAL = 1;

  ISOLATION_PROFILE_DEDICATED_RUNTIME = 2;

  ISOLATION_PROFILE_DEDICATED_DATA = 3;

  ISOLATION_PROFILE_FULL = 4;
}

message Environment {
  ResourceMetadata metadata = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  string organization_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.uuid = true
  ];

  string key = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string = {
      min_len: 1
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    }
  ];

  EnvironmentKind kind = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  IsolationProfile isolation = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  google.protobuf.Timestamp expires_at = 6 [(google.api.field_behavior) = OPTIONAL];
}

message EnvironmentBinding {
  string id = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  ResourceRef resource = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).required = true
  ];

  string environment_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.uuid = true
  ];

  string version_ref = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  string configuration_ref = 5 [(google.api.field_behavior) = OPTIONAL];

  int64 revision = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).int64.gte = 0
  ];
}
