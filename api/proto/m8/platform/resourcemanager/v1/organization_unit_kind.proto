syntax = "proto3";
package m8.platform.resourcemanager.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "m8/platform/resourcemanager/v1/resource.proto";

option go_package = "github.com/m8-team/go-genproto/m8/platform/resourcemanager/v1;resourcemanager";

message OrganizationUnitKind {
  enum UnitKindScope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_SYSTEM = 1;
    SCOPE_TENANT = 2;   
    SCOPE_ORGANIZATION = 3;
  }

  ResourceMetadata metadata = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  UnitKindScope scope = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  string tenant_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  string organization_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  string code = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[A-Z_]+$"
  ];

  bool active = 6;
}
