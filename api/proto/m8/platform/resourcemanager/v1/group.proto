syntax = "proto3";
package m8.platform.resourcemanager.v1;
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "m8/platform/resourcemanager/v1/resource.proto";
option go_package = "github.com/m8-team/go-genproto/m8/platform/resourcemanager/v1;resourcemanager";

// Optional business grouping. Independent Organizations require no Group.
message Group {
  ResourceMetadata metadata = 1 [(google.api.field_behavior) = REQUIRED];
  string tenant_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Non-owning business relation between a Group and an Organization.
message GroupOrganizationLink {
  string group_id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
