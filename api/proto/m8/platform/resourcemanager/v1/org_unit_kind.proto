syntax = "proto3";
package m8.platform.resourcemanager.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "m8/platform/resourcemanager/v1/resource.proto";

option go_package = "github.com/m8-team/go-genproto/m8/platform/resourcemanager/v1;resourcemanager";

enum OrgUnitKindScope {
  ORG_UNIT_KIND_SCOPE_UNSPECIFIED = 0;
  ORG_UNIT_KIND_SCOPE_SYSTEM = 1;
  ORG_UNIT_KIND_SCOPE_TENANT = 2;
  ORG_UNIT_KIND_SCOPE_ORGANIZATION = 3;
}

message OrgUnitKind {
  ResourceMetadata metadata = 1 [(google.api.field_behavior) = REQUIRED];
  OrgUnitKindScope scope = 2 [(google.api.field_behavior) = REQUIRED];

  string tenant_id = 3;

  string organization_id = 4;

  string code = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  bool enabled = 6;
  map<string, string> localized_names = 7;
}
