syntax = "proto3";

package m8.platform.iam.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/timestamp.proto";
import "m8/platform/common/extension/v1/extension.proto";
import "m8/platform/iam/v1/authentication.proto";
import "m8/platform/iam/v1/authentication_challenge.proto";
import "m8/platform/iam/v1/authentication_context.proto";
import "m8/platform/iam/v1/authentication_subject.proto";

option go_package = "github.com/m8-team/go-genproto/m8/platform/iam/v1;iam";

// Caller authentication is required for all RPCs, including Create and operation
// polling. Every call must authorize the caller for the owning client/resource.
// Non-Create RPCs additionally require the interaction token described by
// AuthenticationInteraction. IDs alone never authorize access.
// Mutation operations finish when the command is applied, not when the entire
// authentication finishes. Poll Get for subsequent provider-driven changes.
// Mutation request_id deduplication is scoped to caller, client, RPC and target.
// Retain keys at least 24 hours and through authentication expiry; identical
// retries return the original operation without repeating side effects, while
// reuse with a different payload returns ALREADY_EXISTS. Authorize before replay.
service AuthenticationService {
  option (m8.platform.common.extension.v1.description) = "";

  // Returns the latest public snapshot, including asynchronous state changes.
  rpc Get(GetRequest) returns (Authentication) {
    option (google.api.http) = {get: "/iam/v1/authentications/{authentication_id}"};
  }

  rpc Create(CreateRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/authentications:create"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "AuthenticationOperationResponse"
      metadata_type: "AuthenticationOperationMetadata"
    };
  }

  rpc Cancel(CancelRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/authentications/{authentication_id}:cancel"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "AuthenticationOperationResponse"
      metadata_type: "AuthenticationOperationMetadata"
    };
  }

  rpc SelectChallenge(SelectChallengeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/authentications/{authentication_id}/challenges/{challenge_id}:select"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "AuthenticationOperationResponse"
      metadata_type: "AuthenticationOperationMetadata"
    };
  }

  rpc ResendChallenge(ResendChallengeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/authentications/{authentication_id}/challenges/{challenge_id}:resend"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "AuthenticationOperationResponse"
      metadata_type: "AuthenticationOperationMetadata"
    };
  }

  rpc VerifyChallenge(VerifyChallengeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/authentications/{authentication_id}/challenges/{challenge_id}:verify"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "AuthenticationOperationResponse"
      metadata_type: "AuthenticationOperationMetadata"
    };
  }
}

message GetRequest {
  string authentication_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true
  ];
}

message CreateRequest {
  option (buf.validate.message).cel = {
    id: "authentication_create.use_start_context"
    message: "context is output-only; use start_context instead"
    expression: "!has(this.context)"
  };

  string client_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  AuthenticationSubject subject = 2;

  // Deprecated output context. Servers reject a supplied value with
  // INVALID_ARGUMENT; never trust caller-supplied resolved context.
  AuthenticationContext context = 3 [deprecated = true];

  AuthenticationOptions options = 4;

  // Untrusted input hints; the server resolves and verifies authoritative state.
  AuthenticationStartContext start_context = 5;

  // Optional for legacy clients. Supply a fresh UUID for each logical command
  // and reuse it on retries. Omission provides no retry deduplication guarantee.
  string request_id = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message ResendChallengeRequest {
  string authentication_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string challenge_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Idempotency key; see AuthenticationService and CreateRequest.request_id.
  string request_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message SelectChallengeRequest {
  string authentication_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // One of the available_challenges[].challenge_id values in the latest snapshot.
  // Reject unavailable or stale candidates without changing the active challenge.
  string challenge_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Idempotency key; see AuthenticationService and CreateRequest.request_id.
  string request_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message VerifyChallengeRequest {
  string authentication_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string challenge_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  AuthenticationChallengeResponse response = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Idempotency key; retries must not consume additional verification attempts.
  string request_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message CancelRequest {
  string authentication_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string reason = 3 [(buf.validate.field).string.max_len = 512];

  // Idempotency key; see AuthenticationService and CreateRequest.request_id.
  string request_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message AuthenticationOperationMetadata {
  string operation_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).string.uuid = true
  ];

  string authentication_id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message AuthenticationOperationResponse {
  Authentication authentication = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Present only for a successful Create. Operation reads and retries require
  // the original caller's authentication and authorization. Never publish this
  // response as an event or log it. Other mutations omit this secret capability.
  AuthenticationInteraction interaction = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message AuthenticationOptions {
  string method_id = 5 [(buf.validate.field).string.max_len = 255];

  string provider_id = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}
