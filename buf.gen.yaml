version: v2
plugins:
  - remote: buf.build/connectrpc/go:v1.20.0
    out: internal/proto
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/go
    out: internal/proto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: internal/proto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: internal/proto
    opt:
      - paths=source_relative
  - remote: buf.build/community/google-gnostic-openapi
    out: docs/openapi
    opt:
      - title=M8 Platform API
      - description=HTTP API specifications generated from protobuf contracts.
      - version=v1
      - default_response=false
      - naming=json
      - enum_type=string
      #- output_mode=source_relative
