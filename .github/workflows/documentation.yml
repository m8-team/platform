name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/documentation.yml'
  push:
    branches: [new]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs --no-audit --no-fund
      - run: npm --prefix docs run build
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: diplodoc-site
          path: docs/build/site/
          if-no-files-found: error
          retention-days: 7
