name: Format YDB missing parent integration assertion once
on:
  push:
    branches: [fix/resource-manager-create-org-missing-tenant]
    paths: ['.github/workflows/resource-manager-missing-tenant-ydb-format-once.yml']
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resource-manager-create-org-missing-tenant
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Format YDB integration test
        run: gofmt -w internal/resourcemanager/adapter/ydb/catalog_integration_test.go
      - name: Commit formatted test and remove temporary workflow
        run: |
          git rm .github/workflows/resource-manager-missing-tenant-ydb-format-once.yml
          git add -u -- internal/resourcemanager/adapter/ydb/catalog_integration_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(resourcemanager): gofmt missing parent YDB assertion'
          git push origin HEAD:fix/resource-manager-create-org-missing-tenant
