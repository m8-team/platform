name: Console one-time lockfile update

on:
  push:
    branches: [feat/resource-manager-organizations-ui-p01]
    paths: ['.github/workflows/console-ui-lockfile-once.yml']

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resource-manager-organizations-ui-p01
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update console lockfile
        working-directory: ui/apps/console
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile and delete bootstrap workflow
        run: |
          git rm .github/workflows/console-ui-lockfile-once.yml
          git add ui/apps/console/pnpm-lock.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(ui): lock TypeScript ESLint dependency'
          git push origin HEAD:feat/resource-manager-organizations-ui-p01
