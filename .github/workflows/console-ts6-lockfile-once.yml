name: Console TypeScript lockfile refresh

on:
  push:
    branches: [feat/resource-manager-organizations-ui-p01]
    paths: ['.github/workflows/console-ts6-lockfile-once.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resource-manager-organizations-ui-p01
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock supported TypeScript version
        working-directory: ui/apps/console
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile and delete temporary workflow
        run: |
          git rm .github/workflows/console-ts6-lockfile-once.yml
          git add ui/apps/console/pnpm-lock.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(ui): update console TypeScript 6 lockfile'
          git push origin HEAD:feat/resource-manager-organizations-ui-p01
