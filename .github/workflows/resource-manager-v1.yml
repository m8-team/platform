name: Canonical v1 protobuf and Resource Manager
on:
  push:
    branches:
      - feat/resource-manager-v1-runtime-20261025
  pull_request:
    paths:
      - 'api/proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'api/generate/**'
      - 'internal/resourcemanager/v1engine/**'
      - '.github/workflows/resource-manager-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: bufbuild/buf-setup-action@v1
      - name: Check protobuf lint
        run: buf lint
      - name: Generate canonical protobuf bindings
        run: buf generate
      - name: Test isolated Resource Manager v1 core
        run: go test ./internal/resourcemanager/v1engine
      - name: Commit generated bindings on integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/resource-manager-v1-runtime-20261025'
        run: |
          if [ -n "$(git status --porcelain -- api/generate)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/generate
            git commit -m "chore(proto): regenerate canonical v1 bindings [skip ci]"
            git push
          fi
      - name: Verify full module build
        run: go test ./...
