name: Canonical v1 protobuf and Resource Manager
on:
  push:
    branches: [main]
    paths:
      - 'api/proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'api/generate/**'
      - 'internal/resourcemanager/v1engine/**'
      - '.github/workflows/resource-manager-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
      - name: Check protobuf lint
        run: buf lint
      - name: Generate canonical protobuf bindings
        run: buf generate
      - name: Test isolated Resource Manager v1 core
        run: go test ./internal/resourcemanager/v1engine
      - name: Verify full module build
        run: go test ./...
