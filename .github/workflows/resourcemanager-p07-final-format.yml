name: P0.7 final gofmt for integration extensions
on:
  push:
    branches: [feat/resourcemanager-unified-ydb-p07-p08]
    paths: ['.github/workflows/resourcemanager-p07-final-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resourcemanager-unified-ydb-p07-p08
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - run: find internal/resourcemanager cmd/resource-manager -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
      - name: Store formatting and remove one-time formatter
        run: |
          git rm .github/workflows/resourcemanager-p07-final-format.yml
          git add -u -- internal/resourcemanager cmd/resource-manager
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(resourcemanager): gofmt integration coverage'
          git push origin HEAD:feat/resourcemanager-unified-ydb-p07-p08
