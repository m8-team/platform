name: Resource Manager P0.6 YDB and Access checks

on:
  push:
    branches: [main]
    paths:
      - 'internal/resourcemanager/**'
      - 'cmd/resource-manager/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/resourcemanager-p06-bootstrap.yml'
  pull_request:
    paths:
      - 'internal/resourcemanager/**'
      - 'cmd/resource-manager/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/resourcemanager-p06-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Verify gofmt
        run: |
          violations="$(find internal/resourcemanager cmd/resource-manager -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
          if [ -n "$violations" ]; then printf 'Unformatted:\n%s\n' "$violations"; exit 1; fi
      - name: Verify Go tests
        run: go test ./internal/resourcemanager/... ./cmd/resource-manager/...
      - name: Verify Go race detection
        run: go test -race ./internal/resourcemanager/app/orgstructure ./internal/resourcemanager/adapter/orgaccess ./internal/resourcemanager/adapter/memory
