name: TEMP Generate OrganizationRelationship bindings and formatting
on:
  push:
    branches:
      - feat/resource-manager-organization-groups-p1-20261027
    paths:
      - 'api/proto/m8/platform/resourcemanager/v1/organization_relationship.proto'
      - 'internal/resourcemanager/**'
      - '.github/workflows/temporary-generate-relationships.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/feat/resource-manager-organization-groups-p1-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ github.token }}
      - name: Generate protobufs and Go format
        run: |
          buf generate
          find internal/resourcemanager cmd/resource-manager -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
      - name: Commit generated source to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/generate/go/m8/platform/resourcemanager/v1 \
            api/generate/openapi/m8/platform/resourcemanager/v1 \
            internal/resourcemanager cmd/resource-manager
          git diff --cached --quiet || (git commit -m "chore(resource-manager): generate relationship protobufs and format Go" && git push)
