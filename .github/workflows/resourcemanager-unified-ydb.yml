name: Resource Manager unified YDB catalog

on:
  push:
    branches: [main]
    paths:
      - 'internal/resourcemanager/**'
      - 'cmd/resource-manager/**'
      - 'docs/executable-baseline/data/ydb/m8-resource-manager/**'
      - '.github/workflows/resourcemanager-unified-ydb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Check gofmt
        run: |
          unformatted="$(find internal/resourcemanager cmd/resource-manager -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Run Resource Manager tests
        run: go test -race ./internal/resourcemanager/... ./cmd/resource-manager/...

  ydb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      ydb:
        image: ydbplatform/local-ydb:latest
        options: --hostname localhost
        ports:
          - 2136:2136
        env:
          YDB_GRPC_ENABLE_TLS: "false"
          GRPC_PORT: "2136"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Verify atomic Organization provisioning and catalog persistence
        env:
          M8_RM_TEST_YDB_DSN: grpc://127.0.0.1:2136/local
          M8_RM_TEST_YDB_PREFIX: /local/m8
          M8_RM_TEST_YDB_BOOTSTRAP: "1"
        run: go test -v -count=1 -timeout=180s ./internal/resourcemanager/adapter/ydb -run '^TestIntegrationUnifiedCatalogAndAtomicOrganization$'
