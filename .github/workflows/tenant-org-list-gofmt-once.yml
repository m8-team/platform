name: Format tenant Organization listing tests once
on:
  push:
    branches: [fix/resourcemanager-tenant-scoped-organizations-list]
    paths: ['.github/workflows/tenant-org-list-gofmt-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resourcemanager-tenant-scoped-organizations-list
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: gofmt all ResourceManager code
        run: find internal/resourcemanager -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
      - name: Commit formatting, remove temporary workflow
        run: |
          git rm .github/workflows/tenant-org-list-gofmt-once.yml
          git add -u -- internal/resourcemanager
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(resourcemanager): gofmt tenant organization listing regression tests'
          git push origin HEAD:fix/resourcemanager-tenant-scoped-organizations-list
