name: Temporary profile graph test formatting

on:
  pull_request:
    paths:
      - ".github/workflows/access-profile-extra-format.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Export gofmt for added tests
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, subprocess
          from pathlib import Path
          names = ["internal/access/adapters/spicedb/universal_live_integration_test.go",
                   "internal/access/app/rolemanagement/activation_test.go"]
          for name in names:
              before=Path(name).read_bytes()
              after=subprocess.run(["gofmt"],input=before,check=True,capture_output=True).stdout
              if before==after:continue
              encoded=base64.b64encode(after).decode()
              parts=[encoded[i:i+3000] for i in range(0,len(encoded),3000)]
              for i,part in enumerate(parts):
                  print(f"M8FMT|{name}|{i}|{len(parts)}|{part}")
          PY
