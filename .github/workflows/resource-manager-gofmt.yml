name: Resource Manager Go formatting

on:
  push:
    branches:
      - fix/resourcemanager-gofmt-main-20261027

permissions:
  contents: write

jobs:
  apply-gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/resourcemanager-gofmt-main-20261027
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Format Resource Manager
        run: find internal/resourcemanager -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
      - name: Commit formatted code
        run: |
          git add -u -- internal/resourcemanager
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(resourcemanager): apply gofmt'
            git push origin HEAD:fix/resourcemanager-gofmt-main-20261027
          fi
      - name: Verify formatting
        run: |
          unformatted="$(find internal/resourcemanager -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
