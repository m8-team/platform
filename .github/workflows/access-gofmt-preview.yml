name: Access gofmt preview (temporary)

on:
  pull_request:
    paths:
      - "internal/access/**"
      - ".github/workflows/access-gofmt-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Emit canonical gofmt snapshots for review
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [[ -f "$path" && "$path" == *.go ]] || continue
            gofmt -w "$path"
            printf 'M8_GOFMT_SOURCE:%s:%s\n' "$path" "$(base64 -w0 "$path")"
          done < <(git diff --merge-base --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- internal/access/)
