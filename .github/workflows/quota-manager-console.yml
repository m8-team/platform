name: M8 Console UI

on:
  pull_request:
    paths:
      - 'ui/console/**'
      - '.github/workflows/quota-manager-console.yml'
  push:
    branches: [main]
    paths:
      - 'ui/console/**'
      - '.github/workflows/quota-manager-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Long-running Operations demo tests
        run: node --experimental-strip-types --test src/modules/long-running-operations/demo.test.mjs
      - name: Gateway demo tests
        run: node --experimental-strip-types --test src/modules/gateway/demo.test.mjs
      - name: Audit demo tests
        run: node --experimental-strip-types --test src/modules/audit/demo.test.mjs
      - name: Observability demo tests
        run: node --experimental-strip-types --test src/modules/observability/demo.test.mjs
      - name: Settings demo tests
        run: node --experimental-strip-types --test src/modules/settings/demo.test.mjs
      - name: TypeScript + Vite build
        run: pnpm build
