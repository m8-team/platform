name: Temporary Access policy Go formatting exporter

on:
  pull_request:
    paths:
      - ".github/workflows/access-policy-fmt-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Export formatted Go sources for exact review
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import subprocess
          from pathlib import Path
          paths = [
              "internal/access/domain/role/profile_assignment.go",
              "internal/access/app/projection/profile_assignment.go",
              "internal/access/app/projection/profile_assignment_test.go",
              "internal/access/app/projection/profile_validation.go",
              "internal/access/app/projection/worker.go",
              "internal/access/app/policyjournal/manifest.go",
              "internal/access/app/ports/graph_fence.go",
              "internal/access/adapters/spicedb/reconcile.go",
              "internal/access/adapters/ydbcheckpoint/policy.go",
              "internal/access/adapters/ydbroles/policy.go",
              "internal/access/adapters/ydbroles/projection.go",
              "internal/access/app/consistency/universal.go",
              "internal/access/app/consistency/universal_test.go",
              "internal/access/adapters/spicedb/universal.go",
              "internal/access/app/rolemanagement/service.go",
              "internal/access/adapters/ydbroles/policy_live_integration_test.go",
          ]
          changed = 0
          for name in paths:
              original = Path(name).read_bytes()
              result = subprocess.run(["gofmt"], input=original, capture_output=True, check=True).stdout
              if original == result:
                  continue
              b64 = base64.b64encode(result).decode("ascii")
              chunks = [b64[i:i+3000] for i in range(0, len(b64), 3000)]
              for i,chunk in enumerate(chunks):
                  print(f"M8FMT|{name}|{i}|{len(chunks)}|{chunk}")
              changed += 1
          print(f"FORMAT_CHANGED={changed}")
          PY
