name: Resource Manager OrgUnit API consistency

on:
  push:
    branches:
      - main
    paths:
      - 'api/proto/m8/platform/resourcemanager/v1/org_*.proto'
      - 'api/generate/go/m8/platform/resourcemanager/v1/**'
      - 'internal/resourcemanager/**'
      - '.github/workflows/resourcemanager-orgunit-proto.yml'
  pull_request:
    paths:
      - 'api/proto/m8/platform/resourcemanager/v1/org_*.proto'
      - 'api/generate/go/m8/platform/resourcemanager/v1/**'
      - 'internal/resourcemanager/**'
      - '.github/workflows/resourcemanager-orgunit-proto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ github.token }}
      - name: Lint Protobuf
        run: buf lint
      - name: Verify generated Go bindings
        run: |
          buf generate
          git diff --exit-code -- api/generate/go/m8/platform/resourcemanager/v1
          test -z "$(git ls-files --others --exclude-standard api/generate/go/m8/platform/resourcemanager/v1)"
      - name: Verify gofmt
        run: make fmt-check-resourcemanager
      - name: Test Resource Manager
        run: go test ./internal/resourcemanager/...
