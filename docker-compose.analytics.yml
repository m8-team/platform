name: m8-analytics

include:
  - path: deploy/local/datalens/docker-compose.yaml
    env_file: deploy/local/datalens/.env

services:
  yt-backend:
    image: ghcr.io/ytsaurus/local:${YTSAURUS_VERSION:-stable}
    platform: ${YTSAURUS_PLATFORM:-linux/amd64}
    hostname: yt-backend
    environment:
      YT_FORCE_IPV4: "1"
      YT_FORCE_IPV6: "0"
      YT_USE_HOSTS: "0"
      YTSERVER_ALL_PATH: /usr/bin/ytserver-all
      YT_LOCAL_ROOT_PATH: /tmp
    command:
      - --fqdn
      - yt-backend
      - --port-range-start
      - "24400"
      - --node-port-set-size
      - "100"
      - --proxy-config
      - '{coordinator={public_fqdn="localhost:8000"};}'
      - --rpc-proxy-count
      - "0"
      - --node-count
      - "1"
      - --queue-agent-count
      - "1"
      - --address-resolver-config
      - '{enable_ipv4=%true;enable_ipv6=%false;}'
      - --native-client-supported
      - --id
      - locasaurus
      - -c
      - '{name=query-tracker}'
      - -c
      - '{name=yql-agent;config={path="/usr/bin";count=1;artifacts_path="/usr/bin"}}'
    ports:
      - "${YT_PROXY_PORT:-8000}:80"
    volumes:
      - yt-cypress:/var/lib/yt/local-cypress
      - chyt-binaries:/opt/chyt:ro
    healthcheck:
      test: ["CMD-SHELL", "yt --proxy localhost:80 get //sys/@cluster_name >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      default:
        aliases:
          - locasaurus

  yt-frontend:
    image: ghcr.io/ytsaurus/ui:${YTSAURUS_UI_VERSION:-stable}
    platform: ${YTSAURUS_PLATFORM:-linux/amd64}
    environment:
      YT_LOCAL_CLUSTER_ID: locasaurus
      PROXY: localhost:${YT_PROXY_PORT:-8000}
      PROXY_INTERNAL: yt-backend:80
      APP_ENV: local
    depends_on:
      yt-backend:
        condition: service_healthy
    ports:
      - "${YT_UI_PORT:-8001}:80"

  chyt-binaries:
    image: ghcr.io/ytsaurus/chyt:${CHYT_VERSION:-2.18.6}
    platform: ${YTSAURUS_PLATFORM:-linux/amd64}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /usr/bin/ytserver-clickhouse /opt/chyt/ytserver-clickhouse
        cp /usr/bin/clickhouse-trampoline /opt/chyt/clickhouse-trampoline
        chmod 0555 /opt/chyt/ytserver-clickhouse /opt/chyt/clickhouse-trampoline
    volumes:
      - chyt-binaries:/opt/chyt
    restart: "no"

  chyt:
    image: ghcr.io/ytsaurus/local:${YTSAURUS_VERSION:-stable}
    platform: ${YTSAURUS_PLATFORM:-linux/amd64}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        upload() {
          local source="$$1"
          local destination="$$2"
          yt --proxy yt-backend:80 create file "$$destination" --recursive --ignore-existing
          yt --proxy yt-backend:80 write-file "$$destination" < "$$source"
          yt --proxy yt-backend:80 set "$$destination/@executable" true
        }

        upload /opt/chyt/ytserver-clickhouse //sys/bin/ytserver-clickhouse
        upload /opt/chyt/clickhouse-trampoline //sys/bin/clickhouse-trampoline

        exec yt --proxy yt-backend:80 clickhouse start-clique \
          --instance-count 1 \
          --alias ch_public \
          --cypress-ytserver-clickhouse-path //sys/bin/ytserver-clickhouse \
          --cypress-clickhouse-trampoline-path //sys/bin/clickhouse-trampoline \
          --cpu-limit 1
    depends_on:
      chyt-binaries:
        condition: service_completed_successfully
      yt-backend:
        condition: service_healthy
    volumes:
      - chyt-binaries:/opt/chyt:ro
    restart: on-failure

volumes:
  yt-cypress:
  chyt-binaries:

